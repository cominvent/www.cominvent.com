baseURL = "https://cominvent.com/"   # apex domain is canonical; www redirects to apex
title = "Cominvent"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]   # single-page site: no /tags/ or /categories/ pages
                                      # (they'd carry the nav's #anchors and fail htmltest)

[languages.en]
  locale = "en-us"

[params]
  description = "Cominvent AS — Jan Høydahl, independent consultant in Drammen, Norway. Apache Software Foundation member and Apache Lucene/Solr committer & PMC; expert in Apache Solr and OpenSearch, plus AI, open-source data platforms and cyber security."
  author = "Cominvent AS"
  tagline = "Search, AI, data & security — engineered by specialists."
  intro = "Cominvent is the independent practice of Jan Høydahl — Apache Lucene & Solr committer and Apache Software Foundation member, based in Drammen, Norway. Expert help with open-source search (Apache Solr & OpenSearch), plus AI & chatbots, open-source data platforms and cyber security."
  email = "info@cominvent.com"
  linkedin = "https://www.linkedin.com/in/janhoy/"
  solrtraining = "https://solrtraining.com"   # online Apache Solr training business
  contact_endpoint = "https://contact.cominvent.com"   # cominvent-contact Worker (see contact-worker/)
  # Cloudflare Turnstile (anti-spam). Site key public; matching secret on the Worker (TURNSTILE_SECRET).
  turnstile_sitekey = "0x4AAAAAAEWIBXn7V-Prx1fH"
  # Single-page scroll: nav = in-page anchors (see the [[menu.main]] anchors below).

[[menu.main]]
  name = "Services"
  url = "#services"
  weight = 1
[[menu.main]]
  name = "Work"
  url = "#work"
  weight = 2
[[menu.main]]
  name = "Clients"
  url = "#testimonials"
  weight = 3
[[menu.main]]
  name = "About"
  url = "#about"
  weight = 4
[[menu.main]]
  name = "Contact"
  url = "#contact"
  weight = 5

[markup.goldmark.renderer]
  unsafe = true
