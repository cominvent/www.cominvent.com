<!doctype html>
<html lang="{{ or .Site.Language.Lang "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ "/" | relURL }}">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-name">{{ .Site.Title }}</span>
      </a>
      <nav class="site-nav">
        {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="is-active"{{ end }}>{{ .Name }}</a>{{ end }}
      </nav>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="footer-mark" aria-hidden="true">C</span>
      <p>© {{ now.Year }} {{ .Site.Params.author }}</p>
    </div>
  </footer>
</body>
</html>
